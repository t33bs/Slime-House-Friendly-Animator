on:
  workflow_dispatch:
  push:
    paths:
      - 'friendly_animator.py'
      - 'studio/**'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/build-friendly-animator.yml'
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name SlimeHouseFriendlyAnimator friendly_animator.py
      - name: Record Windows display and Qt runtime diagnostics
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
          python -c "import PySide6; print('PySide6:', PySide6.__version__)"
      - name: Test packaged GUI and offline resources on Windows
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/SlimeHouseFriendlyAnimator/SlimeHouseFriendlyAnimator.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged GUI smoke test failed: $($p.ExitCode)" }
      - name: Verify installed application files
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/SlimeHouseFriendlyAnimator/SlimeHouseFriendlyAnimator.exe')) { throw 'EXE missing' }
          if (!(Test-Path 'dist/SlimeHouseFriendlyAnimator/_internal')) { throw 'Bundled dependencies missing' }
      - name: Compile Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.47.0 packaging\FriendlyAnimator.iss'
      - name: Test silent install, installed GUI and uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'dist-installer/*.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer not produced' }
          $target = Join-Path $env:RUNNER_TEMP 'SlimeHouseFriendlyAnimator-Install-Test'
          $log = Join-Path $env:RUNNER_TEMP 'friendly-installer.log'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target", "/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $installed = Join-Path $target 'SlimeHouseFriendlyAnimator.exe'
          if (!(Test-Path $installed)) { throw 'Installed EXE missing' }
          $p = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed GUI smoke test failed: $($p.ExitCode)" }
          $uninstall = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'Application executable remained after uninstall' }
      - name: Test reinstall/upgrade and preservation of user projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'dist-installer/*.exe' | Select-Object -First 1
          if (!$setup) { throw 'Installer not produced' }
          $target = Join-Path $env:RUNNER_TEMP 'SlimeHouseFriendlyAnimator-Upgrade-Test'
          $userData = Join-Path $env:RUNNER_TEMP 'FriendlyAnimator-UserProjects'
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $project = Join-Path $userData 'precious-creature.project'
          $original = [System.Text.Encoding]::UTF8.GetBytes('Keep my artwork safe across upgrades and uninstall!')
          [System.IO.File]::WriteAllBytes($project, $original)
          $expectedHash = (Get-FileHash -Algorithm SHA256 $project).Hash
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target")
          foreach ($pass in 1..2) {
            $p = Start-Process -FilePath $setup.FullName -ArgumentList $installArgs -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Install/upgrade pass $pass failed: $($p.ExitCode)" }
            $exe = Join-Path $target 'SlimeHouseFriendlyAnimator.exe'
            if (!(Test-Path $exe)) { throw "EXE missing after pass $pass" }
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "GUI smoke failed after pass $pass: $($p.ExitCode)" }
            if (!((Get-FileHash -Algorithm SHA256 $project).Hash -eq $expectedHash)) {
              throw "User project changed during install/upgrade pass $pass"
            }
          }
          $uninstall = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstall)) { throw 'Uninstaller missing after upgrade' }
          $p = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall after upgrade failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target 'SlimeHouseFriendlyAnimator.exe')) { throw 'EXE remained after uninstall' }
          if (!((Get-FileHash -Algorithm SHA256 $project).Hash -eq $expectedHash)) {
            throw 'User project changed during uninstall'
          }
      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FriendlyAnimator-Installer-Diagnostics
          path: ${{ runner.temp }}/friendly-installer.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SlimeHouseFriendlyAnimator-Windows-Portable
          path: dist/SlimeHouseFriendlyAnimator/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SlimeHouseFriendlyAnimator-Windows-Installer
          path: dist-installer/*.exe
          if-no-files-found: error
